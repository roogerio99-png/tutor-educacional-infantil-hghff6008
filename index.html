    <meta property="og:title" content="Aprendiz — Tutor Educacional" />

    <!-- Inline Standalone Splash Pre-paint Styles -->
    <style>
      #pwa-splash {
        position: fixed;
        inset: 0;
        background: #FFF8F0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 99999;
        transition: opacity 0.3s ease-out, visibility 0.3s ease-out;
        font-family: 'Nunito', system-ui, -apple-system, sans-serif;
      }
      #pwa-splash.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .splash-logo-box {
        width: 88px;
        height: 88px;
        border-radius: 24px;
        background: linear-gradient(135deg, #FF9E43 0%, #F28C28 50%, #D95C08 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 12px 32px rgba(242, 140, 40, 0.3);
        margin-bottom: 16px;
        animation: splash-pulse 2s infinite ease-in-out;
      }
      .splash-title {
        font-size: 26px;
        font-weight: 800;
        color: #4A3B32;
        letter-spacing: -0.5px;
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .splash-subtitle {
        font-size: 14px;
        font-weight: 600;
        color: #9C8B7D;
        margin-top: 4px;
      }
      @keyframes splash-pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.05); }
      }
    </style>
  </head>

  <body>
    <!-- Splash screen instantâneo para primeiro paint standalone no mobile -->
    <div id="pwa-splash" aria-hidden="true">
      <div class="splash-logo-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="46" height="46">
          <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20" />
          <path d="M6 6h10" />
          <path d="M12 9.5 C12 8.5 13 8 13.7 8.7 C14.5 9.5 14.5 10.5 12 12.5 C9.5 10.5 9.5 9.5 10.3 8.7 C11 8 12 8.5 12 9.5 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0.5" />
        </svg>
      </div>
      <div class="splash-title">
        <span>Aprendiz</span>
        <span style="color: #F28C28;">✦</span>
      </div>
      <div class="splash-subtitle">Tutor Educacional Infantil</div>
    </div>

    <div id="root"></div>
    <!-- @skip-protected: Do not remove. Required for app features. -->
    <script src="https://goskip.dev/skip.js"></script>
    <!-- @skip-protected: Do not remove. App entrypoint. -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
